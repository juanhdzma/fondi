services:
  fondi:
    build: .
    container_name: fondi
    ports:
      - "8080:8000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # En prod front y back son el mismo origen, así que no hace falta abrir CORS a nadie.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Horas entre backups automáticos de la DB dentro del volumen (0 lo desactiva).
      - BACKUP_INTERVAL_H=${BACKUP_INTERVAL_H:-24}
      # Solo con un reverse proxy adelante: hace que el límite de intentos de clave cuente
      # por cliente real (X-Forwarded-For) y no por la IP del proxy. Ver .env.example.
      - TRUST_PROXY=${TRUST_PROXY:-}
    volumes:
      - fondi-db:/data
    restart: unless-stopped

volumes:
  # `name` fija el nombre real del volumen: sin esto compose le antepone el del proyecto/stack
  # (fondi_fondi-db) y renombrar el stack lo hace crear uno nuevo y vacío — la app levanta
  # perfecta con el fondo en cero y la historia queda en el volumen viejo que nadie mira.
  fondi-db:
    name: fondi_db
